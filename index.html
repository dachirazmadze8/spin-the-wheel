<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spin the wheel</title>

  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>

    <section>
      <img class="logo" src="wolt.jpg" alt="Wolt">
    </section>

    <section>
      <div class="stage">
        <div class="pointer" aria-hidden="true"></div>
        <canvas id="wheel" role="img" aria-label="Spinning wheel. Press the Spin button to spin."></canvas>
      </div>
    </section>

    <section class="panel">
      <div>
        <h1>Spin the wheel</h1>
        <p class="sub">Add your options, then spin to pick one.</p>
      </div>

      <div class="result" id="result" aria-live="polite">Ready to spin</div>

      <label class="t" for="opts">Options (one per line)</label>
      <textarea id="opts">
Pizza
Tacos
Meatballs
Noodles</textarea>

      <label class="check">
        <input type="checkbox" id="remove">
        Remove the winner after each spin
      </label>

      <div class="row">
        <button id="spin">Spin</button>
      </div>

      <p class="hint" id="hint"></p>
    </section>

  </main>

  <script src="script.js"></script>
</body>

</html>
