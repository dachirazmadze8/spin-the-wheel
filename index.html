<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spin the wheel</title>

  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>

    <!-- The wheel -->
    <section>
      <div class="stage">
        <div class="pointer" aria-hidden="true"></div>
        <canvas id="wheel" role="img" aria-label="Spinning wheel. Press the Spin button to spin."></canvas>
      </div>
    </section>

    <!-- Options and controls -->
    <section class="panel">
      <div>
        <h1>Spin the wheel</h1>
        <p class="sub">Add your options, then spin to pick one.</p>
      </div>

      <div class="result" id="result" aria-live="polite">Ready to spin</div>

      <label class="t" for="opts">Options (one per line)</label>
      <textarea id="opts">Pizza taco</textarea>

      <label class="check">
        <input type="checkbox" id="remove">
        Remove the winner after each spin
      </label>

      <div class="row">
        <button id="spin">Spin</button>
      </div>

      <p class="hint" id="hint"></p>
    </section>

  </main>

  <script>
    (function () {

      var COLORS = ['#ff7a6b', '#ffc247', '#43d3c3', '#8e9bff', '#ff9cc0', '#9bdc6a'];
      var INK = '#14232e';
      var TAU = Math.PI * 2;

      var canvas = document.getElementById('wheel');
      var ctx = canvas.getContext('2d');
      var textarea = document.getElementById('opts');
      var spinButton = document.getElementById('spin');
      var resultEl = document.getElementById('result');
      var hintEl = document.getElementById('hint');
      var removeBox = document.getElementById('remove');

      var items = [];
      var angle = 0;
      var spinning = false;

      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function mod(x, m) {
        return ((x % m) + m) % m;
      }

      function readItems() {
        items = textarea.value
          .split('\n')
          .map(function (line) { return line.trim(); })
          .filter(Boolean)
          .slice(0, 40);

        spinButton.disabled = spinning || items.length < 2;
        hintEl.textContent = items.length < 2
          ? 'Add at least two options to spin.'
          : items.length + ' options';
      }

      function draw() {
        var size = canvas.clientWidth || 400;
        var dpr = window.devicePixelRatio || 1;

        canvas.width = canvas.height = Math.round(size * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, size, size);

        var center = size / 2;
        var radius = center - 4;
        var count = items.length;

        ctx.lineWidth = 3;
        ctx.strokeStyle = INK;

        if (!count) {
          ctx.beginPath();
          ctx.arc(center, center, radius, 0, TAU);
          ctx.fillStyle = '#c9d6df';
          ctx.fill();
          ctx.stroke();
          return;
        }

        var slice = TAU / count;

        for (var i = 0; i < count; i++) {
          var start = angle + i * slice;

          ctx.beginPath();
          ctx.moveTo(center, center);
          ctx.arc(center, center, radius, start, start + slice);
          ctx.closePath();
          ctx.fillStyle = COLORS[i % COLORS.length];
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.save();
          ctx.translate(center, center);
          ctx.rotate(start + slice / 2);
          ctx.fillStyle = INK;
          ctx.textAlign = 'right';
          ctx.textBaseline = 'middle';

          var fontSize = Math.max(11, Math.min(22, size * 0.05, slice * radius * 0.55));
          ctx.font = '800 ' + fontSize + 'px "Bricolage Grotesque", system-ui, sans-serif';

          var label = items[i];
          if (label.length > 16) {
            label = label.slice(0, 15) + '…';
          }
          ctx.fillText(label, radius - 16, 0);
          ctx.restore();
        }

        ctx.beginPath();
        ctx.arc(center, center, radius, 0, TAU);
        ctx.lineWidth = 5;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(center, center, size * 0.06, 0, TAU);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.stroke();
      }


      function spin() {
        if (spinning || items.length < 2) return;

        spinning = true;
        spinButton.disabled = true;
        resultEl.textContent = 'Spinning…';

        var count = items.length;
        var slice = TAU / count;
        var winnerIndex = Math.floor(Math.random() * count);
        var offsetInSlice = (0.15 + Math.random() * 0.7) * slice;
        var targetAngle = mod(1.5 * Math.PI - (winnerIndex * slice + offsetInSlice), TAU);

        var extraTurns = reduceMotion ? 1 : 5 + Math.floor(Math.random() * 3);
        var distance = mod(targetAngle - angle, TAU) + TAU * extraTurns;

        var startAngle = angle;
        var duration = reduceMotion ? 600 : 4800;
        var startTime = performance.now();

        function frame(now) {
          var progress = Math.min(1, (now - startTime) / duration);
          var eased = 1 - Math.pow(1 - progress, 4);

          angle = startAngle + distance * eased;
          draw();

          if (progress < 1) {
            requestAnimationFrame(frame);
          } else {
            finish(winnerIndex);
          }
        }

        requestAnimationFrame(frame);
      }

      function finish(winnerIndex) {
        spinning = false;
        var winner = items[winnerIndex];

        // Show the result
        resultEl.innerHTML = '';
        var caption = document.createElement('small');
        caption.textContent = 'Winner';
        resultEl.appendChild(caption);
        resultEl.appendChild(document.createTextNode(winner));

        if (removeBox.checked) {
          var lines = textarea.value.split('\n');
          for (var i = 0; i < lines.length; i++) {
            if (lines[i].trim() === winner) {
              lines.splice(i, 1);
              textarea.value = lines.join('\n');
              break;
            }
          }
        }

        readItems();
        draw();
      }

      spinButton.addEventListener('click', spin);
      canvas.addEventListener('click', spin);

      textarea.addEventListener('input', function () {
        readItems();
        draw();
      });

      window.addEventListener('resize', draw);

      readItems();
      draw();

    })();
  </script>
</body>

</html>
